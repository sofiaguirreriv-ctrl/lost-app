<!-- 2. PESTAÑA CICLO (PERSONALIZABLE + FERIADOS / ADJUNTOS) -->

  <p id="ciclo-hoy-resumen"></p>

  <div class="lost-box">
    <label for="ciclo-desc-input">Descripción de tu ciclo:</label>
    <textarea id="ciclo-desc-input" rows="2" placeholder="Describe cómo funciona tu ciclo..."></textarea>

    <label for="ciclo-letras-input">Letras o códigos del ciclo (separados por coma):</label>
    <input type="text" id="ciclo-letras-input" value="A, B, C, D" />

    <div class="lv-row">
      <div>
        <label for="ciclo-ancla-fecha">Fecha de referencia:</label>

        <select id="ciclo-ancla-letra"></select>

    <h3>Días feriados (Sombrilla)</h3>

  <div class="lost-box">
    <h3>Consultar fecha en tu ciclo</h3>

    </div>
    <div id="ciclo-consulta-salida"></div>
  </div>
</section>

  // FECHAS ESPECIALES GLOBALES (disponibles en Lunes-Viernes, Ciclo y Mater Salvatoris)

    "12-25": [{ emoji: "🎄", nombre: "Navidad" }],

  function obtenerEspecialesGlobal(iso) {
    if (!iso || iso.length < 10) return [];
    return FECHAS_ESPECIALES_GLOBALES[iso.slice(5)] || [];
  }

  function parseFecha(iso) {
    const [y, m, d] = iso.split("-").map(Number);
    return new Date(y, m - 1, d);
  }

  function toISO(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, "0");
    const d = String(date.getDate()).padStart(2, "0");
    return `${y}-${m}-${d}`;
  }

  function abrirPestanaLOST(id) {
    document.querySelectorAll(".lost-tab-panel").forEach(p => (p.style.display = "none"));
    document.querySelectorAll("#lost-main-tabs .tab-btn").forEach(b => {
      b.classList.toggle("active", b.dataset.tab === id);
    });
    const panel = document.getElementById(id);
    if (panel) panel.style.display = "block";
    if (id === "tab-lunes-viernes") renderLunesViernes();
    if (id === "tab-ciclo") renderConsultaCicloUsuario();
    if (id === "tab-mater-salvatoris") renderCalendarioMater();
  }

  // --- LUNES-VIERNES ---
  function renderLunesViernes() {
    const input = document.getElementById("lv-fecha-input");
    const res = document.getElementById("lv-resultado");
    const grid = document.getElementById("lv-semana-grid");
    const hoyBanner = document.getElementById("lv-hoy-especial");
    if (!input || !res || !grid) return;

    const hoyISO = toISO(new Date());
    const espHoy = obtenerEspecialesGlobal(hoyISO);
    if (hoyBanner) {
      hoyBanner.textContent = espHoy.length
        ? `Hoy (${hoyISO}): ${espHoy.map(e => `${e.emoji} ${e.nombre}`).join(" · ")}`
        : `Hoy (${hoyISO})`;
    }

    const base = parseFecha(input.value || hoyISO);
    const espDia = obtenerEspecialesGlobal(toISO(base));
    res.innerHTML = `<strong>${toISO(base)}:</strong> ${
      espDia.length ? espDia.map(e => `${e.emoji} ${e.nombre}`).join(", ") : "Día sin fecha especial global registrada."
    }`;

    // Lunes a viernes de la semana seleccionada
    const dow = base.getDay();
    const diffLunes = dow === 0 ? -6 : 1 - dow;
    const lunes = new Date(base.getFullYear(), base.getMonth(), base.getDate() + diffLunes);

    let cards = "";
    for (let i = 0; i < 5; i++) {
      const d = new Date(lunes.getFullYear(), lunes.getMonth(), lunes.getDate() + i);
      const iso = toISO(d);
      const esp = obtenerEspecialesGlobal(iso);
      const nombreDia = d.toLocaleDateString("es-PR", { weekday: "long", day: "numeric", month: "short" });
      cards += `
        <div class="lv-dia-card">
          <strong>${nombreDia}</strong>
          <div style="margin-top:4px;font-size:0.85em;">
            ${esp.length ? esp.map(e => `<div>${e.emoji} ${e.nombre}</div>`).join("") : "<span>—</span>"}
          </div>
        </div>
      `;
    }
    grid.innerHTML = cards;
  }

  // --- CICLO PERSONALIZADO ---
  const KEY_CICLO_LOST = "lost_tab_ciclo_v1";
  let estadoCicloLOST = {
    descripcion: "",
    letras: ["A", "B", "C", "D"],
    anclaFecha: toISO(new Date()),
    anclaLetra: "A",
    feriados: []
  };

  function initCicloLOST() {
    const raw = localStorage.getItem(KEY_CICLO_LOST);
    if (raw) {
      try { estadoCicloLOST = { ...estadoCicloLOST, ...JSON.parse(raw) }; } catch (e) {}
    }
    document.getElementById("ciclo-desc-input").value = estadoCicloLOST.descripcion || "";
    document.getElementById("ciclo-letras-input").value = estadoCicloLOST.letras.join(", ");
    document.getElementById("ciclo-ancla-fecha").value = estadoCicloLOST.anclaFecha;
    refrescarSelectAnclaUsuario();
    document.getElementById("ciclo-ancla-letra").value = estadoCicloLOST.anclaLetra;
    document.getElementById("ciclo-consulta-fecha").value = toISO(new Date());
    renderFeriadosUsuario();
    renderConsultaCicloUsuario();
  }

  function refrescarSelectAnclaUsuario() {
    const letras = document.getElementById("ciclo-letras-input").value.split(",").map(s => s.trim()).filter(Boolean);
    const lista = letras.length ? letras : ["A"];
    const sel = document.getElementById("ciclo-ancla-letra");
    const actual = sel.value || estadoCicloLOST.anclaLetra;
    sel.innerHTML = lista.map(l => `<option value="${l}">${l}</option>`).join("");
    if (lista.includes(actual)) sel.value = actual;
  }

  document.getElementById("ciclo-letras-input")?.addEventListener("input", refrescarSelectAnclaUsuario);

  function guardarCicloUsuario() {
    const letras = document.getElementById("ciclo-letras-input").value.split(",").map(s => s.trim()).filter(Boolean);
    if (!letras.length) return;
    estadoCicloLOST.descripcion = document.getElementById("ciclo-desc-input").value.trim();
    estadoCicloLOST.letras = letras;
    estadoCicloLOST.anclaFecha = document.getElementById("ciclo-ancla-fecha").value || toISO(new Date());
    estadoCicloLOST.anclaLetra = document.getElementById("ciclo-ancla-letra").value || letras[0];
    localStorage.setItem(KEY_CICLO_LOST, JSON.stringify(estadoCicloLOST));
    if (typeof guardarEnNubeLOST === "function") guardarEnNubeLOST();
    renderConsultaCicloUsuario();
  }

  function agregarFeriadoUsuario() {
    const fecha = document.getElementById("ciclo-feriado-fecha").value;
    const nombre = document.getElementById("ciclo-feriado-nombre").value.trim() || "Feriado";
    if (!fecha) return;
    if (!estadoCicloLOST.feriados.some(f => f.fecha === fecha)) {
      estadoCicloLOST.feriados.push({ fecha, nombre });
      estadoCicloLOST.feriados.sort((a, b) => a.fecha.localeCompare(b.fecha));
      guardarCicloUsuario();
      renderFeriadosUsuario();
    }
    document.getElementById("ciclo-feriado-nombre").value = "";
  }

  function quitarFeriadoUsuario(fecha) {
    estadoCicloLOST.feriados = estadoCicloLOST.feriados.filter(f => f.fecha !== fecha);
    guardarCicloUsuario();
    renderFeriadosUsuario();
  }

  function cargarArchivoFeriadosUsuario(ev) {
    const file = ev.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const txt = String(reader.result || "").trim();
      let items = [];
      if (file.name.endsWith(".json")) {
        try {
          const arr = JSON.parse(txt);
          if (Array.isArray(arr)) {
            items = arr.filter(x => x && x.fecha).map(x => ({ fecha: String(x.fecha).trim(), nombre: String(x.nombre || "Feriado").trim() }));
          }
        } catch (e) { return; }
      } else {
        items = txt.split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(l => {
          const [f, ...r] = l.split(",");
          return { fecha: f.trim(), nombre: r.join(",").trim() || "Feriado" };
        }).filter(x => /^\d{4}-\d{2}-\d{2}$/.test(x.fecha));
      }
      items.forEach(it => {
        if (!estadoCicloLOST.feriados.some(f => f.fecha === it.fecha)) {
          estadoCicloLOST.feriados.push(it);
        }
      });
      estadoCicloLOST.feriados.sort((a, b) => a.fecha.localeCompare(b.fecha));
      guardarCicloUsuario();
      renderFeriadosUsuario();
      ev.target.value = "";
    };
    reader.readAsText(file);
  }

  function renderFeriadosUsuario() {
    const ul = document.getElementById("ciclo-lista-feriados");
    if (!ul) return;
    ul.innerHTML = estadoCicloLOST.feriados.length
      ? estadoCicloLOST.feriados.map(f => `<li><strong>${f.fecha}</strong> — ${f.nombre} <button type="button" onclick="quitarFeriadoUsuario('${f.fecha}')">Quitar</button></li>`).join("")
      : "<li>Sin feriados agregados.</li>";
  }

  function calcularCicloUsuarioEnFecha(iso) {
    const feriado = estadoCicloLOST.feriados.find(f => f.fecha === iso);
    if (feriado) return `Sombrilla (${feriado.nombre})`;
    const fecha = parseFecha(iso);
    if (fecha.getDay() === 0 || fecha.getDay() === 6) return "Fin de semana";

    const letras = estadoCicloLOST.letras.length ? estadoCicloLOST.letras : ["A"];
    const idx0 = Math.max(0, letras.indexOf(estadoCicloLOST.anclaLetra));
    const ancla = parseFecha(estadoCicloLOST.anclaFecha);

    const esHabiles = (dt) => {
      const d = dt.getDay();
      if (d === 0 || d === 6) return false;
      return !estadoCicloLOST.feriados.some(f => f.fecha === toISO(dt));
    };

    let pasos = 0;
    const cur = new Date(ancla.getTime());
    if (fecha > ancla) {
      while (toISO(cur) < iso) { cur.setDate(cur.getDate() + 1); if (esHabiles(cur)) pasos++; }
    } else if (fecha < ancla) {
      while (toISO(cur) > iso) { cur.setDate(cur.getDate() - 1); if (esHabiles(cur)) pasos--; }
    }
    const n = letras.length;
    return `Ciclo ${letras[(((idx0 + pasos) % n) + n) % n]}`;
  }

  function renderConsultaCicloUsuario() {
    const hoy = toISO(new Date());
    const espHoy = obtenerEspecialesGlobal(hoy);
    const resumen = document.getElementById("ciclo-hoy-resumen");
    if (resumen) {
      resumen.textContent = `Hoy (${hoy}): ${calcularCicloUsuarioEnFecha(hoy)}${espHoy.length ? " · " + espHoy.map(e => `${e.emoji} ${e.nombre}`).join(" · ") : ""}`;
    }

    const input = document.getElementById("ciclo-consulta-fecha");
    const out = document.getElementById("ciclo-consulta-salida");
    if (!input || !out) return;
    const iso = input.value || hoy;
    const esp = obtenerEspecialesGlobal(iso);
    out.innerHTML = `<p style="margin-top:8px;"><strong>${iso}:</strong> ${calcularCicloUsuarioEnFecha(iso)}</p>${
      esp.length ? `<div>${esp.map(e => `${e.emoji} ${e.nombre}`).join(" · ")}</div>` : ""
    }`;
  }

  // --- MATER SALVATORIS (2026-2027, A-F, ANCLA 20 NOV 2026 = D) ---
  const CICLOS_MATER = ["A", "B", "C", "D", "E", "F"];
  const ANCLA_MATER = "2026-11-20";
  const ANCLA_MATER_IDX = 3; // D

  const FERIADOS_MATER = [
    { inicio: "2026-08-06", fin: "2026-08-07", nombre: "Labores docentes", emoji: "👩‍🏫" },

  let mesMater = new Date(2026, 10, 1);
  let diaMaterSel = "2026-11-20";

  function rangoMatch(arr, iso) {
    return arr.filter(x => iso >= x.inicio && iso <= x.fin);
  }

  function esDiaConCicloMater(dt) {
    const dow = dt.getDay();
    if (dow === 0 || dow === 6) return false;
    return rangoMatch(FERIADOS_MATER, toISO(dt)).length === 0;
  }

  function infoMater(iso) {
    const dt = parseFecha(iso);
    const feriados = rangoMatch(FERIADOS_MATER, iso);
    const eventos = rangoMatch(EVENTOS_MATER, iso);
    const especiales = obtenerEspecialesGlobal(iso);
    const esSombrilla = feriados.length > 0;

    let ciclo = null;
    if (!esSombrilla && dt.getDay() !== 0 && dt.getDay() !== 6) {
      if (iso === ANCLA_MATER) {
        ciclo = CICLOS_MATER[ANCLA_MATER_IDX];
      } else {
        const ancla = parseFecha(ANCLA_MATER);
        let pasos = 0;
        const cur = new Date(ancla.getTime());
        if (dt > ancla) {
          while (toISO(cur) < iso) { cur.setDate(cur.getDate() + 1); if (esDiaConCicloMater(cur)) pasos++; }
        } else {
          while (toISO(cur) > iso) { cur.setDate(cur.getDate() - 1); if (esDiaConCicloMater(cur)) pasos--; }
        }
        const n = CICLOS_MATER.length;
        ciclo = CICLOS_MATER[(((ANCLA_MATER_IDX + pasos) % n) + n) % n];
      }
    }
    return { iso, dt, ciclo, esSombrilla, feriados, eventos, especiales };
  }

  function renderCalendarioMater() {
    const grid = document.getElementById("mater-calendario-grid");
    const label = document.getElementById("mater-mes-label");
    if (!grid || !label) return;

    const y = mesMater.getFullYear();
    const m = mesMater.getMonth();
    const txt = mesMater.toLocaleDateString("es-PR", { month: "long", year: "numeric" });
    label.textContent = txt.charAt(0).toUpperCase() + txt.slice(1);

    const primero = new Date(y, m, 1);
    const offset = (primero.getDay() + 6) % 7;
    const total = new Date(y, m + 1, 0).getDate();

    let html = "";
    for (let i = 0; i < offset; i++) html += `<div class="mater-celda vacia"></div>`;

    for (let d = 1; d <= total; d++) {
      const iso = toISO(new Date(y, m, d));
      const info = infoMater(iso);
      const cls = ["mater-celda"];
      if (info.esSombrilla) cls.push("sombrilla");
      if (iso === diaMaterSel) cls.push("activa");

      const emojis = [
        ...info.especiales.map(e => e.emoji),
        ...info.eventos.map(e => e.emoji || ""),
        ...info.feriados.map(f => f.emoji || "")
      ].filter(Boolean).join(" ");

      const tags = [
        ...info.especiales.map(e => `${e.emoji} ${e.nombre}`),
        ...info.eventos.map(e => `${e.emoji || "📌"} ${e.nombre}`),
        ...info.feriados.map(f => `${f.emoji || "⛱️"} ${f.nombre}`)
      ];

      html += `
        <div class="${cls.join(" ")}" onclick="seleccionarDiaMater('${iso}')">
          <div style="display:flex;justify-content:space-between;align-items:center;font-weight:700;">
            <span>${d} ${emojis}</span>
            ${info.ciclo ? `<span class="mater-badge">${info.ciclo}</span>` : ""}
          </div>
          <div>${tags.slice(0, 2).map(t => `<div class="mater-mini-tag">${t}</div>`).join("")}</div>
        </div>
      `;
    }
    grid.innerHTML = html;
    renderInfoDiaMater(diaMaterSel);
  }

  function renderInfoDiaMater(iso) {
    const box = document.getElementById("mater-dia-info");
    if (!box) return;
    const info = infoMater(iso);
    const estado = info.ciclo ? `Ciclo ${info.ciclo}` : info.esSombrilla ? "Sombrilla (feriado / sin ciclo)" : "Fin de semana";
    const lines = [
      ...info.feriados.map(f => `<li>${f.emoji || "⛱️"} <strong>${f.nombre}</strong> <em>(Sombrilla)</em></li>`),
      ...info.eventos.map(e => `<li>${e.emoji || "📌"} <strong>${e.nombre}</strong></li>`),
      ...info.especiales.map(s => `<li>${s.emoji} <strong>${s.nombre}</strong> <em>(Fecha especial)</em></li>`)
    ];
    box.innerHTML = `<div><strong>${info.iso}</strong> · <strong>${estado}</strong></div>${
      lines.length ? `<ul style="margin:6px 0 0 18px;">${lines.join("")}</ul>` : "<p style='margin:4px 0 0;'>Sin eventos ni feriados en esta fecha.</p>"
    }`;
  }

  function seleccionarDiaMater(iso) { diaMaterSel = iso; renderCalendarioMater(); }
  function moverMesMater(delta) { mesMater = new Date(mesMater.getFullYear(), mesMater.getMonth() + delta, 1); renderCalendarioMater(); }

    const h = new Date();
    diaMaterSel = toISO(h);
